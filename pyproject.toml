[project]
name = "thin-runner-handbook"
version = "0.1.0"
description = "Base Thin Runner scaffold for the Thin Runner Handbook"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
thin-runner = "orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
