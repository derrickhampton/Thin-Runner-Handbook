name: Thin Runner Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run hello skill smoke test
        run: thin-runner run-skill hello_world --json '{"name":"GitHub Actions"}'

      - name: Run hello pipeline smoke test
        run: thin-runner run-pipeline pipelines/hello_pipeline.yaml
